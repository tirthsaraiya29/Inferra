name: "CodeQL Advanced"

on:
  push:
    branches:
      - main
      - canary
  pull_request:
    branches:
      - main
      - canary
  schedule:
    - cron: "21 20 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: "Analyze (${{ matrix.language }})"
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:

          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@117234705f102444482f0131998505825d00c9f2 # v4.2.2

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@3a4729f27d49818ab445a6c3821ef9a5f4f8102a # v4.7.0
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@babb66191ecb9ed93766a2b8e390c58e805fec42 # v3.28.10
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          dependency-caching: true

      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean compileDebugSources

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@babb66191ecb9ed93766a2b8e390c58e805fec42 # v3.28.10
        with:
          category: "/language:${{ matrix.language }}"
