name: Daily Model Intelligence Pipeline

on:
  schedule:
    # Trigger nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      strict_mode:
        description: 'Enforce strict validation checks'
        required: false
        default: 'false'

jobs:
  ingest-validate-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@117234705f102444482f0131998505825d00c9f2 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@39cd14951b08e74b059732155557623a5d60eadc # v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Validation & Pipeline Tests
        run: |
          python -m unittest discover -s database -p "*.py" || true

      - name: Execute Inferra Ingestion & Validation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          INFERRA_LOG_LEVEL: INFO
          INFERRA_STRICT_VALIDATION: ${{ github.event.inputs.strict_mode == 'true' && '1' || '0' }}
        run: |
          python database/inferra_data.py run

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: inferra-android-release
          path: app/src/main/assets/inferra_models_v1.sqlite3
          retention-days: 14
