name: Daily Build & Validation Pipeline

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@117234705f102444482f0131998505825d00c9f2 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@3a4729f27d49818ab445a6c3821ef9a5f4f8102a # v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests & Assemble Debug APK
        run: ./gradlew test assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: inferra-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
